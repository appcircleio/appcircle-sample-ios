name: AC Plugin Test
on: workflow_dispatch
jobs:
  td-ios:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test Distribution Test Job"
      - run: curl -fSL -o app.ipa "https://storage.googleapis.com/appcircle-dev-common/self-hosted/sample-apps/appcircle-sample-ios.ipa"
      - uses: appcircleio/appcircle-testing-distribution-githubaction@main
        with:
          personalAPIToken: ${{ secrets.AC_MARKETPLACE_TEST_API_KEY }}
          profileName: Marketplace-Github-Action-Test
          appPath: app.ipa
  eas-ios:
    runs-on: ubuntu-latest
    steps:
      - run: echo "EAS Test Job"
      - run: curl -fSL -o app.ipa "https://storage.googleapis.com/appcircle-dev-common/self-hosted/sample-apps/appcircle-sample-ios.ipa"
      - uses: appcircleio/appcircle-enterprise-app-store-githubaction@main
        with:
          personalAPIToken: ${{ secrets.AC_MARKETPLACE_TEST_API_KEY }}
          appPath: app.ipa
